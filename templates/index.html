<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dear Diarrhea</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23ff8eb8'/%3E%3Crect x='7' y='2' width='2' height='12' fill='%23fffdfc'/%3E%3Crect x='2' y='7' width='12' height='2' fill='%238fcef6'/%3E%3C/svg%3E">
<script>
try {
  const saved = localStorage.getItem('theme');
  const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if (!saved) document.documentElement.dataset.themeAuto = '1';
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:ital,opsz,wght@0,9..144,460;0,9..144,650;0,9..144,700;1,9..144,460&family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 15 15" aria-hidden="true">
        <g fill="#8fcef6"><rect x="6" y="0" width="3" height="15"/><rect x="0" y="6" width="15" height="3"/></g>
        <rect x="6" y="6" width="3" height="3" fill="#ff6aa3"/>
      </svg>
      <div>
        <span class="brand-name">Dear Diarrhea</span>
        <span class="brand-tag">I don't chase, I attract. What belongs to me will simply find me.</span>
      </div>
    </div>
    <div class="streak" id="streak" title="Days you've written in a row">
      <svg class="streak-mark" viewBox="0 0 17 15" aria-hidden="true">
        <rect x="2" y="1" width="4" height="2"/>
        <rect x="11" y="1" width="4" height="2"/>
        <rect x="1" y="3" width="15" height="2"/>
        <rect x="1" y="5" width="15" height="2"/>
        <rect x="3" y="7" width="11" height="2"/>
        <rect x="5" y="9" width="7" height="2"/>
        <rect x="7" y="11" width="3" height="2"/>
      </svg>
      <div class="streak-copy">
        <div class="streak-count"><b id="streakNum">0</b> <span id="streakLabel">days in a row</span></div>
        <small id="streakHint"></small>
      </div>
    </div>
    <input id="search" class="search" type="search" placeholder="Search your pages…" autocomplete="off">
    <div class="calendar" id="calendar"></div>
    <div class="side-foot">
      <p class="side-note">taskbar</p>
      <nav class="side-nav">
        <button type="button" class="nav-btn" id="btnToday">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/></svg>
          <span>Today</span>
        </button>
        <button type="button" class="nav-btn" id="btnStats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10M12 19V5M19 19v-7"/></svg>
          <span>Stats</span>
        </button>
        <button type="button" class="nav-btn" id="btnExport">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M5 19h14"/></svg>
          <span>Export</span>
        </button>
        <button type="button" class="nav-btn" id="btnTheme">
          <svg class="ico-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a6.5 6.5 0 1 0 10.5 10.5z"/></svg>
          <svg class="ico-day" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
          <span class="for-light">Night mode</span>
          <span class="for-dark">Day mode</span>
        </button>
        <button type="button" class="nav-btn" id="btnLock">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <span>Lock</span>
        </button>
      </nav>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="lightbox" id="lightbox" hidden>
  <img alt="">
  <span class="lb-hint">click to close</span>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
