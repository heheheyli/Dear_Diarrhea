<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dear Diarrhea</title>
<link rel="icon" href="{{ url_for('logo_svg') }}" type="image/svg+xml">
<script>
try {
  const saved = localStorage.getItem('theme');
  const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if (!saved) document.documentElement.dataset.themeAuto = '1';
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:ital,opsz,wght@0,9..144,460;0,9..144,650;0,9..144,700;1,9..144,460&family=Nunito:wght@600;700;800&family=Pixelify+Sans:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="lock-page">
<form class="lock-card" method="post" autocomplete="off">
  <div class="lock-mark" aria-hidden="true">
    <img src="{{ url_for('logo_svg') }}" alt="">
  </div>
  <p class="eyebrow">dear diarrhea</p>
  <h1>{{ "Make a secret" if setup else "Sup welcome back" }}</h1>
  <p class="lede">{{ "4-8 digits. I'll ask every time you open this ^^" if setup else "Yo what's the pin?" }}</p>
  <input type="password" name="pin" inputmode="numeric" pattern="\d{4,8}" maxlength="8" placeholder="pin" autofocus required>
  {% if setup %}
  <input type="password" name="confirm" inputmode="numeric" pattern="\d{4,8}" maxlength="8" placeholder="and again" required>
  {% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit" class="btn primary">{{ "Set my pin" if setup else "Let me in bro" }}</button>
</form>
</body>
</html>
